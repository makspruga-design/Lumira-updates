name: Resume verified Lumira 0.19.70 draft
on:
  push:
    branches: [main]
    paths:
      - 'tools/resume_publish_01970.py'
      - '.github/workflows/resume-01970.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lumira-public-release
  cancel-in-progress: false
jobs:
  resume-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Assemble the existing signed payload
        run: python tools/assemble_payload.py
      - name: Verify unchanged publisher and resume the exact existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/resume_publish_01970.py --report resume-01970-receipt.json
      - name: Retain recovery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumira-resume-01970-receipt
          path: resume-01970-receipt.json
          if-no-files-found: ignore
