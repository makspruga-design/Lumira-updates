name: Verify live auction durability
on:
  push:
    branches: [main]
    paths: ['checks/auction-smoke.mjs', '.github/workflows/auction-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumira-live-auction-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check durable trade through public WebSocket
        run: node checks/auction-smoke.mjs
