name: Publish Lumira 0.19.35 local fallback

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-01935-local-fallback.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumira-public-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Rebuild candidate from signed local fallback inputs
        run: |
          curl -L --fail --retry 3 -o /tmp/android.json https://github.com/makspruga-design/Lumira-updates/releases/download/v0.19.34/lumira-017-android.json
          curl -L --fail --retry 3 -o /tmp/windows.json https://github.com/makspruga-design/Lumira-updates/releases/download/v0.19.34/lumira-017-windows.json
          python - <<'PY'
          import base64,hashlib,io,json,zipfile
          from pathlib import Path
          from cryptography.hazmat.primitives.serialization import load_pem_public_key
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives import hashes

          inp_path=Path('release/fallback-01935-input.json')
          expected_input_sha='309af061160cec38c6a6565083743db93f5602d65e428b045e7b8e0d74a31c9c'
          assert hashlib.sha256(inp_path.read_bytes()).hexdigest()==expected_input_sha, 'fallback input bytes changed'
          inp=json.loads(inp_path.read_text('utf-8'))
          assert inp['version']=='0.19.35' and inp['code']==72
          assert inp['previous_version']=='0.19.34' and inp['previous_code']==71
          assert inp['source_content_sha256']=='bce7ffc0d8cfb1721632a81c37d9a38206c86c74a8908ed9e4d3221e2dede3ee'
          key=load_pem_public_key(Path('update-public.pem').read_bytes())
          tag='v'+inp['version']
          public_root='https://github.com/makspruga-design/Lumira-updates/releases/download/'
          def compact(v): return json.dumps(v,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          def sha(b): return hashlib.sha256(b).hexdigest()
          def archive_zip(entries):
              bio=io.BytesIO()
              with zipfile.ZipFile(bio,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
                  for name,data in sorted(entries.items()):
                      info=zipfile.ZipInfo(name,(2026,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o644<<16
                      zf.writestr(info,data)
              return bio.getvalue()

          asset_bytes={};new_packs={}
          for resource,meta in sorted(inp['packs'].items()):
              b=base64.b64decode(meta['base64'],validate=True)
              assert len(b)==meta['size'] and sha(b)==meta['sha256']
              with zipfile.ZipFile(io.BytesIO(b)) as zf:
                  assert zf.namelist()==[resource] and zf.testzip() is None
              fn=meta['sha256']+'.zip';asset_bytes[fn]=b
              new_packs[resource]={'sha256':meta['sha256'],'size':meta['size'],'url':public_root+tag+'/'+fn,'resource':resource,'content_sha256':inp['source_content_sha256']}

          manifests={}
          for platform in ('android','windows'):
              old=json.loads(Path('/tmp/'+platform+'.json').read_text('utf-8'))
              old_payload=base64.b64decode(old['payload'],validate=True)
              key.verify(base64.b64decode(old['signature'],validate=True),old_payload,padding.PKCS1v15(),hashes.SHA256())
              doc=json.loads(old_payload)
              assert doc['version']==inp['previous_version'] and doc['version_code']==inp['previous_code']
              assert doc['native_id']=='lumira-017' and doc['platform']==platform and doc['engine']=='4.3' and doc['protocol']==1
              doc['version']=inp['version'];doc['version_code']=inp['code'];doc['notes']=inp['notes']
              doc['packs']=[p for p in doc['packs'] if p.get('resource') not in new_packs]+[new_packs[n] for n in sorted(new_packs)]
              raw=compact(doc)
              sig=base64.b64decode(inp['signatures'][platform],validate=True)
              key.verify(sig,raw,padding.PKCS1v15(),hashes.SHA256())
              manifests[f'lumira-017-{platform}.json']=compact({'payload':base64.b64encode(raw).decode('ascii'),'signature':inp['signatures'][platform]})
              print(platform,'signature verified; packs',len(doc['packs']),'manifest',sha(raw))

          archive=archive_zip({**manifests,**asset_bytes})
          candidate={'version':inp['version'],'source_commit':inp['source_commit'],'source_run':inp['source_run'],'archive_sha256':sha(archive),'archive_base64':base64.b64encode(archive).decode('ascii')}
          Path('release/payload.json').write_bytes(compact(candidate))
          print('candidate',len(archive),'bytes archive; sha256',sha(archive))
          PY
      - name: Verify signatures, resources and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/publish.py
