name: Import verified Lumira Render candidate
on:
  push:
    branches: [main]
    paths:
      - 'release/import-render.request.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lumira-import-render-candidate
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Read import request
        id: req
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('release/import-render.request.json',encoding='utf-8'))
          version=str(r['version'])
          url=str(r.get('url','https://lumira-0196-builder.onrender.com/payload.json'))
          assert version and version[0].isdigit()
          assert url.startswith('https://') and '.onrender.com/' in url
          print('version='+version)
          print('url='+url)
          PY
      - name: Fetch signed candidate from Render builder
        run: |
          curl -L --fail --retry 5 --retry-delay 2 \
            '${{ steps.req.outputs.url }}' \
            -o /tmp/payload.json
          python - <<'PY'
          import base64,hashlib,json
          expected='${{ steps.req.outputs.version }}'
          p=json.load(open('/tmp/payload.json',encoding='utf-8'))
          assert p['version']==expected, (p.get('version'), expected)
          assert len(p['source_commit'])==40
          assert len(p['archive_sha256'])==64
          archive=base64.b64decode(p['archive_base64'],validate=True)
          assert hashlib.sha256(archive).hexdigest()==p['archive_sha256']
          print('Candidate',p['version'],'source',p['source_commit'],'archive',p['archive_sha256'])
          PY
          cp /tmp/payload.json release/payload.json
      - name: Verify with public Lumira verifier
        env:
          LUMIRA_VERIFY_ONLY: '1'
          GH_REPO: ${{ github.repository }}
        run: python tools/publish.py
      - name: Promote verified candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release/payload.json
          git commit -m "release: promote Lumira ${{ steps.req.outputs.version }} Render candidate" || exit 0
          git push
