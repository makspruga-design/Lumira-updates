name: Import verified Lumira 0.19.6 candidate
on:
  push:
    branches: [main]
    paths:
      - 'release/import-0196.request'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lumira-import-0196
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Fetch signed candidate from private builder output
        run: |
          curl -L --fail --retry 5 --retry-delay 2 \
            https://lumira-0196-builder.onrender.com/payload.json \
            -o /tmp/payload.json
          python - <<'PY'
          import hashlib,json
          p=json.load(open('/tmp/payload.json',encoding='utf-8'))
          assert p['version']=='0.19.6'
          assert len(p['source_commit'])==40
          assert len(p['archive_sha256'])==64
          assert p['archive_base64']
          print('Candidate',p['version'],'source',p['source_commit'],'archive',p['archive_sha256'])
          PY
          cp /tmp/payload.json release/payload.json
      - name: Verify with the same public verifier used for publication
        env:
          LUMIRA_VERIFY_ONLY: '1'
          GH_REPO: ${{ github.repository }}
        run: python tools/publish.py
      - name: Promote verified candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release/payload.json
          git commit -m 'release: promote Lumira 0.19.6 creature motion v4' || exit 0
          git push
