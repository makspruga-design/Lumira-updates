name: Native integration toolchain
on:
  push:
    branches: [integration/native-01970-toolchain]
    paths: [.github/workflows/native-toolchain.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify official Godot templates
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/godotengine/godot-builds/releases/download/4.3-stable
          curl --fail --location --retry 3 "$url/Godot_v4.3-stable_export_templates.tpz" -o templates.tpz
          curl --fail --location --retry 3 "$url/SHA512-SUMS.txt" -o sums.txt
          python3 - <<'PY'
          import hashlib,pathlib
          line=next(x for x in pathlib.Path('sums.txt').read_text().splitlines() if x.endswith('Godot_v4.3-stable_export_templates.tpz'))
          assert hashlib.sha512(pathlib.Path('templates.tpz').read_bytes()).hexdigest()==line.split()[0]
          PY
          unzip templates.tpz templates/linux_release.x86_64
          chmod +x templates/linux_release.x86_64
          templates/linux_release.x86_64 --headless --version
          sha256sum templates/linux_release.x86_64 > templates/SHA256SUMS
      - name: Recover published native update cache
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,pathlib,hashlib,concurrent.futures
          out=pathlib.Path('native01969');out.mkdir()
          for platform in ['android','windows']:
              url='https://github.com/makspruga-design/Lumira-updates/releases/download/v0.19.69/lumira-017-'+platform+'.json'
              body=urllib.request.urlopen(url,timeout=60).read()
              (out/('lumira-017-'+platform+'.json')).write_bytes(body)
              doc=json.loads(base64.b64decode(json.loads(body)['payload']))
              assert doc['version']=='0.19.69' and doc['version_code']==106
          def get(pack):
              b=urllib.request.urlopen(pack['url'],timeout=60).read()
              assert len(b)==pack['size'] and hashlib.sha256(b).hexdigest()==pack['sha256']
              (out/(pack['sha256']+'.zip')).write_bytes(b)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(get,doc['packs']))
          print('Verified',len(doc['packs']),'native resources')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native01969-cache
          path: native01969/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: godot-4.3-linux-release
          path: templates/
          retention-days: 7
