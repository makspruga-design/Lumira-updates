name: Publish verified Lumira 0.19.71 native test update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-01971.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lumira-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Verify pinned signed inputs and unchanged publisher
        run: python tools/release_01971.py prepare
      - name: Check resource staging and place compatibility warning before activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_01971.py final-draft
      - name: Verify all dependencies and publish with existing atomic publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/publish.py
      - name: Verify all 932 new ZIPs and both actual latest manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_01971.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumira-publication-01971-receipt
          path: publication-01971.json
          if-no-files-found: ignore
